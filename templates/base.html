<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path="rss.xml") }}">
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Langsung ke isi</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Navigasi utama">
      <a class="site-title" href="{{ get_url(path="@/_index.md") }}">{{ config.title }}</a>
      <div class="nav-links">
        <a href="{{ get_url(path="@/_index.md") }}">Beranda</a>
        <a href="{{ get_url(path="blog") }}">Arsip</a>
        <a href="{{ get_url(path="admin") }}">Admin</a>
      </div>
    </nav>
  </header>

  <main class="site-main" id="main">
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; {{ now() | date(format="%Y") }} {{ config.title }}</span>
      <a href="{{ get_url(path="admin") }}">Content Workspace</a>
    </div>
  </footer>
</body>
</html>
